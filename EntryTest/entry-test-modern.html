    <script>
        
    // Data extracted from original file
    const chapters = [
  {
    id:'ch1', icon:'📈',
    title:{zh:'宏观经济学',en:'Macroeconomics'}, weight:'18-20%', studyTime:'3-4h',
    sections:[
      {id:'s1_1',title:{zh:'1.1 经济周期与常见经济指标',en:'1.1 Business Cycle & Economic Indicators'},diff:2,
       content:{
         zh:'<p><b>经济周期</b>是指总体经济活动围绕经济长期潜在增长趋势发生的周期性、不规则波动，包含<b>扩张、顶峰、收缩（衰退）、谷底</b>四个阶段。</p><h3>四个阶段</h3><ul><li><b>扩张期 (Expansion)</b>：GDP稳步增长，就业扩大，消费者信心增强。</li><li><b>顶峰期 (Peak)</b>：经济增长放缓至停滞，通胀压力达到顶峰。</li><li><b>收缩期/衰退期 (Contraction/Recession)</b>：GDP下降，企业削减投资，裁员增加。连续≥2个季度负增长。</li><li><b>谷底期 (Trough)</b>：经济下滑停止，产出触底，信心开始重建。</li></ul><h3>关键驱动因素</h3><ul><li><b>消费支出</b>：占美国GDP 68-70%，主要驱动力。</li><li><b>商业投资</b>：受利率和利润影响。</li><li><b>货币政策</b>：美联储通过利率调节借贷成本。</li><li><b>净出口</b>：受汇率和全球需求影响。</li></ul><h3>常用经济指标</h3><ul><li><b>先行指标 (Leading)</b>：ISM制造业PMI、耐用品订单、消费者信心指数(CCI)、10年-2年国债利差</li><li><b>同步指标 (Coincident)</b>：GDP、非农就业(NFP)、零售销售</li><li><b>滞后指标 (Lagging)</b>：失业率、CPI、PCE物价指数</li></ul>',
         en:'<p><b>The business cycle</b> refers to recurring, irregular fluctuations in aggregate economic activity around the economy\'s long-term potential growth trend. It has <b>four phases: Expansion, Peak, Contraction (Recession), Trough</b>.</p><h3>Four Phases</h3><ul><li><b>Expansion</b>: Real GDP grows steadily; employment expands; consumer confidence strengthens.</li><li><b>Peak</b>: Growth slows to a halt; inflationary pressures peak.</li><li><b>Contraction/Recession</b>: Real GDP declines; businesses cut investment; layoffs increase. Negative growth for ≥2 quarters.</li><li><b>Trough</b>: Economic decline stops; output hits bottom; confidence begins to rebuild.</li></ul><h3>Key Drivers</h3><ul><li><b>Consumer Spending</b>: ~68-70% of U.S. GDP, primary driver.</li><li><b>Business Investment</b>: Sensitive to interest rates and profit margins.</li><li><b>Monetary Policy</b>: Fed adjusts rates to influence borrowing costs.</li><li><b>Net Exports</b>: Affected by USD exchange rate and global demand.</li></ul><h3>Common Economic Indicators</h3><ul><li><b>Leading</b>: ISM Manufacturing PMI, Durable Goods Orders, CCI, 10Y-2Y Spread</li><li><b>Coincident</b>: GDP, Nonfarm Payrolls (NFP), Retail Sales</li><li><b>Lagging</b>: Unemployment Rate, CPI, PCE Price Index</li></ul>'
       }},
      {id:'s1_2',title:{zh:'1.2 货币政策',en:'1.2 Monetary Policy'},diff:2,
       content:{
         zh:'<p><b>目标</b>：充分就业和物价稳定（2%通胀目标）。</p><h3>主要工具</h3><ul><li><b>公开市场操作 (OMO)</b>：买卖国债/MBS，调节准备金。</li><li><b>准备金余额利息 (IORB)</b>：利率下限，主要控制工具。</li><li><b>隔夜逆回购 (ONRRP)</b>：辅助下限，吸收过剩流动性。</li><li><b>贴现率 (Discount Rate)</b>：利率上限，紧急贷款窗口。</li></ul><p><b>加息</b>→借贷成本上升→消费投资减少→经济降温→抑制通胀<br><b>降息</b>→借贷成本下降→消费投资增加→经济刺激→促进就业</p>',
         en:'<p><b>Objectives</b>: Full employment and price stability (2% inflation target).</p><h3>Key Tools</h3><ul><li><b>Open Market Operations (OMO)</b>: Buy/sell Treasuries & MBS to adjust reserves.</li><li><b>Interest On Reserve Balances (IORB)</b>: Rate floor, primary control tool.</li><li><b>Overnight Reverse Repo (ONRRP)</b>: Auxiliary floor, absorbs excess liquidity.</li><li><b>Discount Rate</b>: Rate ceiling, emergency lending window.</li></ul><p><b>Rate hikes</b> → higher borrowing costs → less spending/investment → cools economy → curbs inflation<br><b>Rate cuts</b> → lower borrowing costs → more spending/investment → stimulates economy → promotes employment</p>'
       }},
      {id:'s1_3',title:{zh:'1.3 财政政策',en:'1.3 Fiscal Policy'},diff:1,
       content:{
         zh:'<p><b>工具</b>：税收和政府支出。</p><ul><li><b>扩张性 (Expansionary)</b>：减税/增支，用于衰退期刺激需求。</li><li><b>收缩性 (Contractionary)</b>：加税/减支，用于过热期控制通胀。</li></ul><p><b>逆周期调节</b>：政策方向与经济周期相反，以平滑波动。</p>',
         en:'<p><b>Tools</b>: Taxation and government spending.</p><ul><li><b>Expansionary</b>: Tax cuts / increased spending, used during recessions to boost demand.</li><li><b>Contractionary</b>: Tax hikes / reduced spending, used during overheating to control inflation.</li></ul><p><b>Countercyclical regulation</b>: Policy direction is opposite to the business cycle to smooth fluctuations.</p>'
       }},
      {id:'s1_4',title:{zh:'1.4 政策与资产表现',en:'1.4 Policy & Asset Performance'},diff:3,
       content:{
         zh:'<h3>资产表现</h3><ul><li><b>扩张期</b>：股票(成长型) > 商品 > 债券</li><li><b>衰退期</b>：债券(长债) > 股票(防御型)</li></ul><h3>利率影响</h3><ul><li><b>加息</b>：债券价格下跌（收益率上升），股市承压（估值回调）。</li><li><b>降息</b>：债券价格上涨，股市通常受益（软着陆时），但在衰退期可能下跌。</li></ul>',
         en:'<h3>Asset Performance</h3><ul><li><b>Expansion</b>: Stocks (growth) > Commodities > Bonds</li><li><b>Recession</b>: Bonds (long-term) > Stocks (defensive)</li></ul><h3>Interest Rate Impact</h3><ul><li><b>Rate hikes</b>: Bond prices fall (yields rise), stocks under pressure (valuation correction).</li><li><b>Rate cuts</b>: Bond prices rise, stocks typically benefit (in soft landings), but may fall during recessions.</li></ul>'
       }}
    ]
  },
  {
    id:'ch2', icon:'📊',
    title:{zh:'股票',en:'Stocks'}, weight:'~15%', studyTime:'2-3h',
    sections:[
      {id:'s2_1',title:{zh:'2.1 市场与股票类型',en:'2.1 Markets & Stock Types'},diff:1,
       content:{
         zh:'<ul><li><b>一级市场 (Primary)</b>：IPO，公司发行新股融资。</li><li><b>二级市场 (Secondary)</b>：投资者之间交易已发行股票。</li><li><b>普通股</b>：有投票权，股息不固定，清偿顺位低。</li><li><b>优先股</b>：通常无投票权，股息固定，清偿顺位优先于普通股。</li><li><b>ADR</b>：在美国交易的外国公司股票凭证（如BABA）。</li></ul>',
         en:'<ul><li><b>Primary Market</b>: IPOs, companies issue new shares to raise capital.</li><li><b>Secondary Market</b>: Investors trade existing shares among themselves.</li><li><b>Common Stock</b>: Voting rights, variable dividends, lower liquidation priority.</li><li><b>Preferred Stock</b>: Usually no voting rights, fixed dividends, higher liquidation priority.</li><li><b>ADR</b>: Foreign company stock certificates traded on U.S. exchanges (e.g., BABA).</li></ul>'
       }},
      {id:'s2_2',title:{zh:'2.2 公司行为',en:'2.2 Corporate Actions'},diff:2,
       content:{
         zh:'<ul><li><b>股息 (Dividends)</b>：利润分配。除息日(Ex-Dividend Date)前买入才享有股息。</li><li><b>股票分割 (Stock Splits)</b>：增加股数，降低股价，总价值不变。如苹果2020年4拆1。</li><li><b>股票回购 (Buybacks)</b>：公司买回自家股票，减少流通股，提升EPS。</li><li><b>并购 (M&A)</b>：合并或收购。</li></ul>',
         en:'<ul><li><b>Dividends</b>: Profit distribution. Must own before ex-dividend date to receive.</li><li><b>Stock Splits</b>: Increase shares, reduce price, total value unchanged. E.g., Apple 2020 4-for-1.</li><li><b>Buybacks</b>: Company repurchases own shares, reduces outstanding shares, boosts EPS.</li><li><b>M&A</b>: Mergers and acquisitions.</li></ul>'
       }},
      {id:'s2_3',title:{zh:'2.3 核心估值指标',en:'2.3 Key Valuation Metrics'},diff:2,
       content:{
         zh:'<div class="formula">市值 (Market Cap) = 股价 × 流通股数</div><div class="formula">EPS = (净利润 - 优先股股息) / 平均流通股数</div><div class="formula">股息率 = 每股股息 / 股价</div><div class="formula">P/E = 股价 / EPS （高P/E→高增长预期）</div><div class="formula">P/B = 股价 / 每股净资产 （适用于重资产行业）</div><div class="formula">ROE = 净利润 / 股东权益 （衡量盈利效率）</div>',
         en:'<div class="formula">Market Cap = Share Price × Shares Outstanding</div><div class="formula">EPS = (Net Income - Preferred Dividends) / Avg Shares Outstanding</div><div class="formula">Dividend Yield = Dividend per Share / Share Price</div><div class="formula">P/E = Share Price / EPS (High P/E → high growth expectations)</div><div class="formula">P/B = Share Price / Book Value per Share (useful for asset-heavy industries)</div><div class="formula">ROE = Net Income / Shareholders\' Equity (measures profitability efficiency)</div>'
       }}
    ]
  },
  {
    id:'ch3', icon:'📦',
    title:{zh:'ETF',en:'ETF'}, weight:'~10%', studyTime:'2h',
    sections:[
      {id:'s3_1',title:{zh:'3.1 ETF特征与原理',en:'3.1 ETF Features & Mechanics'},diff:1,
       content:{
         zh:'<p><b>ETF</b>是追踪指数、像股票一样在交易所交易的基金。</p><ul><li><b>机制</b>：申购/赎回机制(Creation/Redemption)保持价格紧贴NAV。</li><li><b>优势</b>：分散风险、低费率、高流动性、税务优势（实物赎回减少资本收益分配）。</li><li><b>风险</b>：市场风险、追踪误差。</li></ul>',
         en:'<p><b>ETF</b> is a fund that tracks an index and trades on exchanges like individual stocks.</p><ul><li><b>Mechanism</b>: Creation/Redemption mechanism keeps price close to NAV.</li><li><b>Advantages</b>: Diversification, low fees, high liquidity, tax efficiency (in-kind redemptions reduce capital gains).</li><li><b>Risks</b>: Market risk, tracking error.</li></ul>'
       }},
      {id:'s3_2',title:{zh:'3.2 常见ETF类型',en:'3.2 Common ETF Types'},diff:1,
       content:{
         zh:'<ul><li><b>股票型</b>：SPY, QQQ</li><li><b>债券型</b>：TLT, AGG</li><li><b>商品型</b>：GLD</li><li><b>加密货币型</b>：IBIT</li><li><b>主题型</b>：ARKK</li></ul>',
         en:'<ul><li><b>Equity</b>: SPY, QQQ</li><li><b>Bond</b>: TLT, AGG</li><li><b>Commodity</b>: GLD</li><li><b>Crypto</b>: IBIT</li><li><b>Thematic</b>: ARKK</li></ul>'
       }},
      {id:'s3_3',title:{zh:'3.3 杠杆与反向ETF',en:'3.3 Leveraged & Inverse ETFs'},diff:3,
       content:{
         zh:'<p><b>原理</b>：使用衍生品放大单日回报（如2x, 3x）。</p><p><b>核心风险 — 波动率损耗 (Volatility Decay)</b>：长期持有会因每日重置机制导致价值侵蚀。仅适合短期交易。</p><p>在<b>高度波动（起伏）的市场</b>中损耗最严重。</p>',
         en:'<p><b>Mechanism</b>: Uses derivatives to amplify daily returns (e.g., 2x, 3x).</p><p><b>Core Risk — Volatility Decay</b>: Long-term holding erodes value due to daily reset mechanism. Only suitable for short-term trading.</p><p>Decay is most severe in <b>highly volatile (up-and-down) markets</b>.</p>'
       }}
    ]
  },
  {
    id:'ch4', icon:'⚡',
    title:{zh:'期权',en:'Options'}, weight:'~10%', studyTime:'3-4h',
    sections:[
      {id:'s4_1',title:{zh:'4.1 期权合约基础',en:'4.1 Option Contract Basics'},diff:1,
       content:{
         zh:'<ul><li><b>Call (看涨)</b>：买方有权以行权价<b>买入</b>，看涨后市。</li><li><b>Put (看跌)</b>：买方有权以行权价<b>卖出</b>，看跌后市。</li><li><b>美式</b>：可随时行权（美股期权主流）。</li><li><b>欧式</b>：仅到期日行权（指数期权主流）。</li></ul>',
         en:'<ul><li><b>Call</b>: Buyer has the right to <b>buy</b> at strike price. Bullish.</li><li><b>Put</b>: Buyer has the right to <b>sell</b> at strike price. Bearish.</li><li><b>American</b>: Can be exercised anytime (dominant for U.S. stock options).</li><li><b>European</b>: Can only be exercised at expiration (dominant for index options).</li></ul>'
       }},
      {id:'s4_2',title:{zh:'4.2 盈亏计算',en:'4.2 Profit/Loss Calculations'},diff:2,
       content:{
         zh:'<div class="formula">Long Call 盈亏平衡点 = Strike + Premium | 最大损失 = Premium</div><div class="formula">Long Put 盈亏平衡点 = Strike - Premium | 最大损失 = Premium</div><div class="formula">Short Call/Put 最大收益 = Premium | Short Call 风险无限</div>',
         en:'<div class="formula">Long Call Breakeven = Strike + Premium | Max Loss = Premium</div><div class="formula">Long Put Breakeven = Strike - Premium | Max Loss = Premium</div><div class="formula">Short Call/Put Max Gain = Premium | Short Call has unlimited risk</div>'
       }},
      {id:'s4_3',title:{zh:'4.3 价值状态与影响因素',en:'4.3 Moneyness & Pricing Factors'},diff:2,
       content:{
         zh:'<h3>价值状态 (Moneyness)</h3><ul><li><b>ITM (价内)</b>：Call（市价>行权价），Put（市价<行权价）。有内在价值。</li><li><b>ATM (平价)</b>：市价≈行权价。</li><li><b>OTM (价外)</b>：无内在价值，仅有时间价值。</li></ul><h3>影响因素</h3><ul><li><b>标的价格↑</b>：Call↑, Put↓</li><li><b>行权价↑</b>：Call↓, Put↑</li><li><b>时间↑</b>：Call/Put通常↑（时间价值）</li><li><b>波动率↑</b>：Call/Put均↑</li></ul>',
         en:'<h3>Moneyness</h3><ul><li><b>ITM (In-the-Money)</b>: Call (S>X), Put (S<X). Has intrinsic value.</li><li><b>ATM (At-the-Money)</b>: S ≈ X.</li><li><b>OTM (Out-of-the-Money)</b>: No intrinsic value, only time value.</li></ul><h3>Pricing Factors</h3><ul><li><b>Stock price ↑</b>: Call↑, Put↓</li><li><b>Strike price ↑</b>: Call↓, Put↑</li><li><b>Time ↑</b>: Call/Put usually ↑ (time value)</li><li><b>Volatility ↑</b>: Both Call/Put ↑</li></ul>'
       }}
    ]
  },
  {
    id:'ch5', icon:'💰',
    title:{zh:'基金',en:'Funds'}, weight:'~10%', studyTime:'1.5-2h',
    sections:[
      {id:'s5_1',title:{zh:'5.1 基金类型',en:'5.1 Fund Types'},diff:1,
       content:{
         zh:'<ul><li><b>共同基金 (Mutual Funds)</b>：<ul><li>开放式：按NAV每日交易，份额可变。</li><li>封闭式：份额固定，交易所交易，可溢价/折价。</li></ul></li><li><b>货币市场基金 (MMF)</b>：投资短期国债/商票，低风险，类现金。</li><li><b>私募/对冲基金</b>：面向合格投资者（净资产>$1M或收入>$200K），高门槛，高费用（2/20结构），策略灵活。</li></ul>',
         en:'<ul><li><b>Mutual Funds</b>:<ul><li>Open-end: Trade daily at NAV, variable shares.</li><li>Closed-end: Fixed shares, exchange-traded, may trade at premium/discount.</li></ul></li><li><b>Money Market Funds (MMF)</b>: Invest in short-term T-bills/commercial paper, low risk, cash-like.</li><li><b>Private/Hedge Funds</b>: For accredited investors (net worth >$1M or income >$200K), high minimums, high fees (2/20 structure), flexible strategies.</li></ul>'
       }},
      {id:'s5_2',title:{zh:'5.2 费用结构',en:'5.2 Fee Structure'},diff:2,
       content:{
         zh:'<ul><li><b>前端收费 (Class A)</b>：买入时付费。</li><li><b>后端收费 (Class B)</b>：卖出时付费，随持有时间递减。</li><li><b>管理费</b>：按AUM每年收取。</li><li><b>绩效费</b>：按利润收取（常见于对冲基金），通常为超过门槛利润的20%。</li></ul>',
         en:'<ul><li><b>Front-end Load (Class A)</b>: Paid when buying.</li><li><b>Back-end Load (Class B)</b>: Paid when selling, decreases with holding time.</li><li><b>Management Fee</b>: Charged annually based on AUM.</li><li><b>Performance Fee</b>: Charged on profits (common in hedge funds), typically 20% of gains above hurdle rate.</li></ul>'
       }}
    ]
  },
  {
    id:'ch6', icon:'📉',
    title:{zh:'常见指数',en:'Common Indexes'}, weight:'6-8%', studyTime:'1h',
    sections:[
      {id:'s6_1',title:{zh:'6.1 收益与加权方法',en:'6.1 Returns & Weighting Methods'},diff:2,
       content:{
         zh:'<h3>收益类型</h3><ul><li><b>价格回报 (Price Return)</b>：仅看指数水平变化，不含股息。</li><li><b>总回报 (Total Return)</b>：包含价格变化+股息再投资。</li></ul><h3>加权方法</h3><ul><li><b>价格加权 (DJIA)</b>：高价股影响大。</li><li><b>市值加权 (S&P500)</b>：大市值公司影响大。</li><li><b>等权重</b>：所有成分股影响相同。</li></ul>',
         en:'<h3>Return Types</h3><ul><li><b>Price Return</b>: Only index level changes, excludes dividends.</li><li><b>Total Return</b>: Includes price changes + reinvested dividends.</li></ul><h3>Weighting Methods</h3><ul><li><b>Price-weighted (DJIA)</b>: Higher-priced stocks have more impact.</li><li><b>Market-cap weighted (S&P 500)</b>: Larger companies have more impact.</li><li><b>Equal-weighted</b>: All stocks have equal impact.</li></ul>'
       }},
      {id:'s6_2',title:{zh:'6.2 主要市场指数',en:'6.2 Major Market Indexes'},diff:1,
       content:{
         zh:'<ul><li><b>美股</b>：标普500（大盘，市值加权）、纳斯达克100（科技/成长）、罗素2000（小盘）、DJIA（价格加权，30只股票）</li><li><b>国际</b>：MSCI EAFE（发达市场除美加）、MSCI Emerging Markets（新兴市场）</li></ul>',
         en:'<ul><li><b>U.S.</b>: S&P 500 (large-cap, market-cap weighted), NASDAQ-100 (tech/growth), Russell 2000 (small-cap), DJIA (price-weighted, 30 stocks)</li><li><b>International</b>: MSCI EAFE (developed ex-US/Canada), MSCI Emerging Markets</li></ul>'
       }}
    ]
  },
  {
    id:'ch7', icon:'📋',
    title:{zh:'财报分析',en:'Financial Analysis'}, weight:'~15%', studyTime:'2-3h',
    sections:[
      {id:'s7_1',title:{zh:'7.1 财务报表基础',en:'7.1 Financial Statement Basics'},diff:1,
       content:{
         zh:'<p>财务报表是总结公司财务活动的正式记录。上市公司需向SEC提交季报(10-Q)和年报(10-K)。</p><ul><li><b>US GAAP</b>（FASB制定）：美国上市公司必须遵守，规则导向。</li><li><b>IFRS</b>（IASB制定）：140+国家使用，原则导向。</li></ul>',
         en:'<p>Financial statements are formal records summarizing company financial activities. Public companies must file quarterly (10-Q) and annual (10-K) reports with the SEC.</p><ul><li><b>US GAAP</b> (by FASB): Mandatory for US public companies, rules-based.</li><li><b>IFRS</b> (by IASB): Used in 140+ countries, principles-based.</li></ul>'
       }},
      {id:'s7_2',title:{zh:'7.2 三大报表',en:'7.2 Three Financial Statements'},diff:2,
       content:{
         zh:'<h3>损益表 (Income Statement)</h3><div class="formula">收入 - COGS = 毛利；毛利 - 运营费用 = 营业利润 (EBIT)；EBIT - 利息/税 = 净利润</div><h3>资产负债表 (Balance Sheet)</h3><div class="formula">资产 (Assets) = 负债 (Liabilities) + 股东权益 (Equity)</div><p>反映特定时点的财务状况。</p><h3>现金流量表 (Cash Flow Statement)</h3><ul><li><b>经营 (CFO)</b>：核心业务运营的现金</li><li><b>投资 (CFI)</b>：购买/出售资产的现金</li><li><b>融资 (CFF)</b>：发行股票/债务/分红的现金</li></ul>',
         en:'<h3>Income Statement</h3><div class="formula">Revenue - COGS = Gross Profit; Gross Profit - OpEx = Operating Income (EBIT); EBIT - Interest/Tax = Net Income</div><h3>Balance Sheet</h3><div class="formula">Assets = Liabilities + Shareholders\' Equity</div><p>Snapshot of financial position at a point in time.</p><h3>Cash Flow Statement</h3><ul><li><b>Operating (CFO)</b>: Cash from core business operations</li><li><b>Investing (CFI)</b>: Cash from buying/selling assets</li><li><b>Financing (CFF)</b>: Cash from issuing stock/debt/dividends</li></ul>'
       }},
      {id:'s7_3',title:{zh:'7.3 核心财务指标',en:'7.3 Key Financial Ratios'},diff:2,
       content:{
         zh:'<div class="formula">毛利率 = (收入 - COGS) / 收入</div><div class="formula">净利率 = 净利润 / 收入</div><div class="formula">ROE = 净利润 / 平均股东权益</div>',
         en:'<div class="formula">Gross Margin = (Revenue - COGS) / Revenue</div><div class="formula">Net Profit Margin = Net Income / Revenue</div><div class="formula">ROE = Net Income / Average Shareholders\' Equity</div>'
       }}
    ]
  },

         zh:'<h3>卖方研究报告</h3><p>分析师提供Buy/Hold/Sell评级和目标价，帮助客户投资决策。</p><h3>营收预测方法</h3><ul><li><b>Bottom-Up</b>：从量、价、门店数等底层驱动因素推导。</li><li><b>Top-Down</b>：从宏观经济、市场规模、市场份额推导。</li></ul>',
         en:'<h3>Sell-Side Research Reports</h3><p>Analysts provide Buy/Hold/Sell ratings and target prices to guide client investment decisions.</p><h3>Revenue Forecasting Methods</h3><ul><li><b>Bottom-Up</b>: Derived from granular drivers like volume, price, store count.</li><li><b>Top-Down</b>: Derived from macro economy, market size, market share.</li></ul>'

    sections:[
      {id:'s9_1',title:{zh:'9.1 监管体系',en:'9.1 Regulatory Framework'},diff:1,
       content:{
         zh:'<ul><li><b>SEC</b>：最高监管机构（政府机构），保护投资者，要求经纪交易商注册。</li><li><b>FINRA</b>：自律组织(SRO)，监管券商和从业人员，管理SIE等考试。</li><li><b>MSRB</b>：制定市政证券规则，但不执行（由FINRA执行）。</li><li><b>NYSE / CBOE</b>：交易所，也是SRO。</li></ul>',
         en:'<ul><li><b>SEC</b>: Top regulator (government agency), protects investors, requires broker-dealer registration.</li><li><b>FINRA</b>: Self-Regulatory Organization (SRO), regulates broker-dealers, administers SIE exam.</li><li><b>MSRB</b>: Creates municipal securities rules but does not enforce (FINRA enforces).</li><li><b>NYSE / CBOE</b>: Exchanges that are also SROs.</li></ul>'
       }},
      {id:'s9_2',title:{zh:'9.2 违规行为',en:'9.2 Violations'},diff:2,
       content:{
         zh:'<ul><li><b>内幕交易 (Insider Trading)</b>：利用非公开信息交易。最高20年监禁+$500万罚款。</li><li><b>抢跑 (Front Running)</b>：先于客户大单交易。严禁。</li><li><b>挪用资金 (Misappropriation)</b>：盗用客户资产。5-20年监禁。</li><li><b>虚假陈述 (Misrepresentation)</b>：误导性宣传。</li></ul>',
         en:'<ul><li><b>Insider Trading</b>: Trading on non-public information. Up to 20 years prison + $5M fine.</li><li><b>Front Running</b>: Trading ahead of client large orders. Strictly prohibited.</li><li><b>Misappropriation</b>: Theft of client assets. 5-20 years prison.</li><li><b>Misrepresentation</b>: Misleading statements or omitting facts.</li></ul>'
       }}
    ]
  }

// State Management
const initialState = {
  lang: localStorage.getItem('lang') || 'zh',
  theme: localStorage.getItem('theme') || 'light',
  quizAnswers: JSON.parse(localStorage.getItem('quizAnswers') || '{}'),
  studyDays: JSON.parse(localStorage.getItem('studyDays') || '{}'),
  checklist: JSON.parse(localStorage.getItem('checklist') || '{}'),
  bookmarks: JSON.parse(localStorage.getItem('bookmarks') || '[]')
};

const state = new Proxy(initialState, {
  set(target, property, value) {
    target[property] = value;
    if (['quizAnswers', 'studyDays', 'checklist', 'bookmarks'].includes(property)) {
      localStorage.setItem(property, JSON.stringify(value));
    } else {
      localStorage.setItem(property, value);
    }
    render();
    return true;
  }
});

  if (typeof obj === 'string') return obj;
  return obj[state.lang] || obj.zh || '';
};

// Actions
const toggleTheme = () => {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  document.documentElement.classList.toggle('dark', state.theme === 'dark');
};

const toggleLang = () => {
  state.lang = state.lang === 'zh' ? 'en' : 'zh';
};

const toggleSidebar = () => {
  document.querySelector('.sidebar').classList.toggle('is-open');
  document.querySelector('.overlay').classList.toggle('is-visible');
};

const navigate = (page) => {
  window.location.hash = page;
  if (window.innerWidth <= 1024) {
    document.querySelector('.sidebar').classList.remove('is-open');
    document.querySelector('.overlay').classList.remove('is-visible');
  }
};

const toggleBookmark = (id, title) => {
  const bookmarks = [...state.bookmarks];
  const index = bookmarks.findIndex(b => b.id === id);
  if (index > -1) {
    bookmarks.splice(index, 1);
  } else {
    bookmarks.push({ id, title });
  }
  state.bookmarks = bookmarks;
};

  const ch = chapters.find(c => c.id === id);
  if (!ch) return Home();
  const isZh = state.lang === 'zh';

  const isBookmarked = state.bookmarks.some(b => b.id === id);

  return `

      ` : ''}

  `;
};

const renderQuestion = (q) => {
  const qIdx = questions.indexOf(q);
  const answer = state.quizAnswers[`q${qIdx}`];
  const isZh = state.lang === 'zh';
  
  return `
    <div class="question-block" id="q-${qIdx}">
      <h4 style="font-weight: 600; margin-bottom: var(--space-4)">${qIdx + 1}. ${t(q.q)}</h4>
      <div class="options grid gap-2">
        ${q.opts.map((opt, i) => {
          let cls = 'option-btn';
          if (answer) {
            if (i === q.ans) cls += ' correct';
            else if (answer.selected === i) cls += ' wrong';
            else cls += ' disabled'; // Optional: disable others
          }
          return `<button class="${cls}" onclick="handleAnswer(${qIdx}, ${i})" ${answer ? 'disabled' : ''}>${String.fromCharCode(65+i)}. ${t(opt)}</button>`;
        }).join('')}
      </div>
      ${answer ? `
        <div class="explanation fade-in">
          <strong>${isZh ? '解析' : 'Explanation'}:</strong> ${t(q.exp)}
        </div>
      ` : ''}
    </div>
  `;
};

const handleAnswer = (qIdx, selected) => {
  const q = questions[qIdx];
  const isCorrect = selected === q.ans;
  const newAnswers = { ...state.quizAnswers, [`q${qIdx}`]: { selected, correct: isCorrect } };
  state.quizAnswers = newAnswers;
  // Re-render only the question block would be better but for now full render
  // Optimization: direct DOM manipulation for specific question
  const btn = document.querySelectorAll(`#q-${qIdx} .option-btn`)[selected];
  // Actually, re-rendering the whole app is fast enough for this size, but let's try to just update the UI?
  // No, let's rely on the main render loop triggered by Proxy setter
};

// Main Render
const render = () => {
  const sidebar = document.querySelector('.sidebar');
  if (sidebar) sidebar.innerHTML = Sidebar();
  
  const main = document.getElementById('app-content');
  const hash = window.location.hash.slice(1);
  
  let content = '';
  if (!hash || hash === 'home') content = Home();
  else if (hash.startsWith('chapter/')) content = Chapter(hash.split('/')[1]);
  else if (hash === 'quiz') content = QuizBank();
  else if (hash === 'plan') content = StudyPlan();
  else if (hash === 'checklist') content = Checklist(); // Logic needs actual data
  else content = Home();
  
  main.innerHTML = content;
